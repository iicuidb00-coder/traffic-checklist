image: docker:latest

stages:
  - deploy
  - delete
  - pre_scan_deploy
  - post_scan_deploy

delete:
  stage: delete
  script:
    - |
      apk add --no-cache curl jq || true
      export SERVICE_NAME="${VOSS_GITLAB_USERNAME}_${VOSS_PROJECT_ID}"
      
      echo "Fetching deployment list for $SERVICE_NAME..."
      RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$VGLOBAL_VMW_API_URL/api/deployments" -H "Authorization: Bearer $VGLOBAL_VMW_API_KEY")
      HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
      JSON_BODY=$(echo "$RESPONSE" | sed '$d')

      if [ "$HTTP_STATUS" -ne 200 ]; then
        echo "Error: Failed to fetch deployments."
        echo "$JSON_BODY"
        exit 1
      fi

      # 서비스명이 매칭되고 상태가 Running인 배포 ID 조회
      DEPLOYMENT_ID=$(echo "$JSON_BODY" | jq -r --arg svc "$SERVICE_NAME" '.deployments[] | select(.service_name == $svc and .status == "Running") | .id' | head -n 1)

      if [ -z "$DEPLOYMENT_ID" ] || [ "$DEPLOYMENT_ID" = "null" ]; then
        echo "No running deployment found for service: $SERVICE_NAME"
        exit 0
      fi

      echo "Stopping and removing deployment $DEPLOYMENT_ID ($SERVICE_NAME)..."
      DEL_RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE "$VGLOBAL_VMW_API_URL/api/deployments/$DEPLOYMENT_ID" -H "Authorization: Bearer $VGLOBAL_VMW_API_KEY")
      DEL_HTTP_STATUS=$(echo "$DEL_RESPONSE" | tail -n 1)

      if [ "$DEL_HTTP_STATUS" -eq 200 ] || [ "$DEL_HTTP_STATUS" -eq 204 ]; then
        echo "Deployment deleted successfully."
      else
        echo "Error: Failed to delete deployment."
        echo "$DEL_RESPONSE" | sed '$d'
        exit 1
      fi
  when: manual

deploy:
  stage: deploy
  script:
    - |
      apk add --no-cache curl jq || true
      export SERVICE_NAME="${VOSS_GITLAB_USERNAME}_${VOSS_PROJECT_ID}"
      TAG=${VOSS_TAG_NAME:-$CI_COMMIT_SHORT_SHA}
      export IMAGE_TAG="$VGLOBAL_REGISTRY/$SERVICE_NAME:$TAG"

      # 1. 빌드 및 푸시
      echo "Building and pushing image $IMAGE_TAG..."
      docker build -t "$IMAGE_TAG" .
      docker push "$IMAGE_TAG"

      # 2. 환경변수 수집
      # 백엔드(VMW)에서 설정된 프리픽스 목록에 따라 자동 필터링
      ENV_JSON=$(env | jq -R -s -c '
        split("\n") | map(select(length > 0)) | map(split("=")) | 
        map({key: .[0], value: .[1:] | join("=")}) | from_entries
      ')
      if [ -z "$ENV_JSON" ] || [ "$ENV_JSON" = "null" ]; then ENV_JSON="{}"; fi

      # 3. 템플릿 기반 배포 페이로드 구성
      PAYLOAD=$(jq -n \
        --arg svc "$SERVICE_NAME" \
        --arg tid "${VGLOBAL_COMPUTE_TEMPLATE:-micro}" \
        --arg img "$IMAGE_TAG" \
        --argjson envs "$ENV_JSON" \
        '{
          "serviceName": $svc,
          "templateId": $tid,
          "image": $img,
          "envVars": $envs
        }'
      )

      # 4. 배포 실행
      echo "Requesting deployment via VMW API..."
      RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$VGLOBAL_VMW_API_URL/api/deployments/run" -H "Authorization: Bearer $VGLOBAL_VMW_API_KEY" -H "Content-Type: application/json" -d "$PAYLOAD")
      
      HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
      JSON_BODY=$(echo "$RESPONSE" | sed '$d')

      if [ "$HTTP_STATUS" -ne 200 ]; then
        echo "Error: Deployment failed."
        echo "$JSON_BODY"
        exit 1
      fi

      DEPLOYMENT_ID=$(echo "$JSON_BODY" | jq -r '.deploymentId')
      echo "Deployment successful (Deployment ID: $DEPLOYMENT_ID)."
  after_script:
    - |
      if [ -n "$DEPLOY_CALLBACK_URL" ] && [ -n "$DEPLOY_CALLBACK_TOKEN" ]; then
        curl -sS -X POST "$DEPLOY_CALLBACK_URL" \
          -H "Authorization: Bearer $DEPLOY_CALLBACK_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"pipeline_id\":\"$CI_PIPELINE_ID\",
            \"job_id\":\"$CI_JOB_ID\",
            \"job_name\":\"$CI_JOB_NAME\",
            \"status\":\"$CI_JOB_STATUS\",
            \"commit\":\"$CI_COMMIT_SHA\",
            \"ref\":\"$CI_COMMIT_REF_NAME\",
            \"project_path\":\"$CI_PROJECT_PATH\"
          }" || true
      fi

  when: manual